<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Vehicle photo unavailable</title><desc id="desc">Neutral placeholder shown when a vehicle photograph cannot be loaded.</desc><rect width="1200" height="750" fill="#e2e8f0"/><rect x="120" y="145" width="960" height="460" rx="34" fill="#cbd5e1"/><text x="600" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#334155">Photo unavailable</text><text x="600" y="425" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#64748b">Real vehicle photo could not be loaded.</text></svg>